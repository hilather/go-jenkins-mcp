# Round-robin VIP for fleet-cache lab (intentionally no stickiness).
upstream fleet_cache_members {
    server member-a:8080;
    server member-b:8080;
    server member-c:8080;
}

server {
    listen 80;
    location / {
        proxy_pass http://fleet_cache_members;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

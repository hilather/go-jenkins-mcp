# CI quality and security pipeline (FND-007).
#
# Merge gate (configure branch protection required checks for these job names):
#   - lint-test-build   (job id: check)  — gofmt, vet, test, race (Ubuntu), build, package
#   - govulncheck                        — vulnerability scan
#   - admin-ui                           — web/admin vitest + tsc + production Vite build
#   - docs-check                         — Markdown links / policy / coverage
#
# Optional / non-blocking (continue-on-error or workflow_dispatch only):
#   - package-smoke     — PKG-001 offline tarball smoke (bare Ubuntu only)
#   - fuzz-smoke        — QA-001 short native fuzz (count-based FUZZTIME=500x)
#   - stdio-smoke       — FND-006 offline MCP binary host-lifecycle (Wave 26+33; not Cursor product)
#   - live-jenkins-smoke — TST-001 Docker Jenkins (workflow_dispatch only)
#   - Perf regression step inside check (Ubuntu only, continue-on-error)
#
# Untrusted PR jobs never inject Jenkins/OAuth secrets (contents: read only).
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Manual only for optional jobs (e.g. live Jenkins smoke). Does not change default push/PR gate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint-test-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tier-1 host runners are Ubuntu; Rocky compatibility is via container job.
        include:
          - id: ubuntu
            container: ""
          - id: rocky9
            container: rockylinux:9
    container: ${{ matrix.container || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go (container)
        if: matrix.container != ''
        run: |
          dnf install -y golang git make tar gzip which || yum install -y golang git make tar gzip which
          go version || true

      - name: Setup Go
        if: matrix.container == ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Go (container fallback pin)
        if: matrix.container != ''
        run: |
          # rockylinux packages may lag; install official toolchain to $HOME
          GOVER=$(grep '^go ' go.mod | awk '{print $2}')
          curl -fsSL "https://go.dev/dl/go${GOVER}.linux-amd64.tar.gz" -o /tmp/go.tgz || \
            curl -fsSL "https://go.dev/dl/go1.25.13.linux-amd64.tar.gz" -o /tmp/go.tgz
          rm -rf "$HOME/.local/go"
          mkdir -p "$HOME/.local"
          tar -C "$HOME/.local" -xzf /tmp/go.tgz
          echo "$HOME/.local/go/bin" >> "$GITHUB_PATH"

      - name: Module download
        # Transient proxy/network blips are a common false red; retry a few times.
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $i); sleep and retry"
            sleep $((i * 5))
          done
          echo "::error::go mod download failed after retries"
          exit 1

      - name: Format check
        # Fail fast with a copy-paste fix. Most recent CI reds are unformatted Go.
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed — run 'make fmt' locally, commit, and push"
            echo "Unformatted files:"
            echo "$unformatted"
            echo ""
            echo "Fix: make fmt && git add -u && git commit -m 'style: gofmt' && git push"
            exit 1
          fi
          echo "gofmt clean"

      - name: Vet
        run: go vet ./...

      - name: Test
        # -count=1 disables cache; -timeout bounds hung tests (avoids "stuck job" GHA kills).
        shell: bash
        run: go test -count=1 -timeout=20m ./...
        env:
          # Never inject real Jenkins credentials into unit CI
          JENKINS_MCP_AUTH: ""

      - name: Test race
        # Ubuntu only: race detector is heavy; bound wall time to avoid runner kill flakiness.
        if: matrix.container == ''
        shell: bash
        run: go test -count=1 -race -timeout=30m ./...
        env:
          JENKINS_MCP_AUTH: ""

      - name: Build
        run: make build

      # QA-003: optional continuous perf regression (Ubuntu host only; budgets are generous).
      # Does not run on Rocky container matrix cell (slower cold start). Not a hard merge
      # requirement historically; continue-on-error keeps default gate green under noise.
      - name: Perf regression (QA-003 opt-in)
        if: matrix.container == ''
        continue-on-error: true
        run: make perf-regression
        env:
          PERF_TOLERANCE_PERCENT: "150"

      - name: Package tarball
        run: make package

      - name: Upload artifacts
        if: matrix.container == ''
        uses: actions/upload-artifact@v4
        with:
          # Unique name per matrix cell if both ever upload (today Ubuntu only).
          name: jenkins-mcp-linux-${{ matrix.id }}
          path: dist/*
          if-no-files-found: warn

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Go lint-test-build does not compile web/admin; this job is the SPA gate.
  admin-ui:
    name: admin-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Admin SPA test + typecheck + production build
        run: make admin-ui-check

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation checks
        run: bash scripts/docs-check.sh

  # Wave 23 / FND-007 expand: PKG-001 offline package smoke (bare Ubuntu only).
  # Does not run in Rocky container (no dpkg tooling assumptions; keeps Rocky job lean).
  # Non-required merge check; continue-on-error so optional branch-protection config stays simple.
  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Package smoke (PKG-001 offline)
        run: make package-smoke
        env:
          # Never inject real Jenkins credentials into unit CI
          JENKINS_MCP_AUTH: ""

  # Wave 23 / FND-007 expand: QA-001 short native fuzz smoke.
  # Count-based FUZZTIME (Nx) avoids wall-clock cancel flakes ("context deadline
  # exceeded") common on GHA with FUZZTIME=1s. scripts/fuzz-smoke.sh also caps
  # GOMAXPROCS and retries pure deadline flakes once. Still non-required.
  # Longer local runs: make fuzz-smoke FUZZTIME=5s  or  -fuzztime=5m per target.
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    # Optional signal only — keep false-red noise off the required merge gate.
    # Real crashers still fail this job (continue-on-error only affects workflow
    # conclusion for branch-protection simplicity).
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz smoke (QA-001 short)
        run: make fuzz-smoke
        env:
          # Never inject real Jenkins credentials into unit CI
          JENKINS_MCP_AUTH: ""
          # Count-based budget (~500 execs/target); override for nightlies.
          FUZZTIME: "500x"
          FUZZ_TIMEOUT: "90s"
          # Bound workers on shared runners (script default is 4 if unset).
          GOMAXPROCS: "4"

  # Wave 26 + Wave 33 / FND-006+FND-007: offline MCP stdio host-lifecycle smoke
  # (make stdio-smoke). Spawns real bin/jenkins-mcp over stdio against httptest Jenkins —
  # host-lifecycle matrix Done*; not Cursor product binary CI.
  # Non-required merge check; continue-on-error (keep until smoke is long-term stable).
  stdio-smoke:
    name: stdio-smoke (host-lifecycle offline)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: MCP stdio host-lifecycle smoke (FND-006 offline binary)
        run: make stdio-smoke
        env:
          # Never inject real Jenkins credentials into unit CI
          # (stdio-smoke uses a canary token + httptest only; env must stay empty of real secrets)
          JENKINS_MCP_AUTH: ""

  # TST-001: disposable Jenkins LTS live smoke — workflow_dispatch only (not push/PR gate).
  live-jenkins-smoke:
    name: live-jenkins-smoke (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Live Jenkins smoke (Docker)
        run: make live-jenkins-test
        env:
          JENKINS_ADMIN_PASSWORD: test
          JENKINS_HOST_PORT: "18080"

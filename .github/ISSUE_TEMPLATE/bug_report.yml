name: Bug report
description: Something is broken or behaves incorrectly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Do not include tokens, cookies, private keys, or unredacted production logs.**
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
      placeholder: doctor reports rs_auth ok offline but serve fails when…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps that reliably reproduce the issue.
      placeholder: |
        1. jenkins-mcp profile add …
        2. jenkins-mcp login --profile …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted CLI/JSON output if useful.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `jenkins-mcp version --json` or a git SHA.
      placeholder: v0.2.0 / aea5e84
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Rocky Linux
        - Ubuntu
        - Other / unknown (unsupported)
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I did not paste secrets, tokens, or unredacted production logs
          required: true
        - label: I searched existing issues for duplicates
          required: false
